<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="father">
        <div class="left"></div>
        <div class="right"></div>
    </div>
</body>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .father{
        display: flex;
        width: 1366px;
        height: 600px;
        background-image: url("images/bg.jpg");
        margin: 0 auto;
         overflow: hidden;
    }
    .father .left,.father .right{
        width: 50%;
        height: 600px;
        background-image: url("images/fm.jpg");
        transition: all 1s;
       
    }
    .father .right{
        background-position: right 0;
    }
    .father:hover .left{

        transform: translate(-100%);
    }
    .father:hover .right{
        transform: translate(100%);
    }
</style>
</html>
