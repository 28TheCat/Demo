# 数据库驱动
jdbc.driver=com.mysql.cj.jdbc.Driver

# 数据库连接URL
jdbc.url=jdbc:mysql://localhost:3306/book_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai

# 数据库用户名
jdbc.username=root

# 数据库密码
jdbc.password=123456

# 初始连接数
jdbc.initialSize=5

# 最大连接数
jdbc.maxActive=20

# 最大空闲连接
jdbc.maxIdle=10

# 最小空闲连接
jdbc.minIdle=3

# 最大等待时间（毫秒）
jdbc.maxWait=60000

# 是否自动提交事务
jdbc.defaultAutoCommit=true

# 连接池验证查询
jdbc.validationQuery=SELECT 1

# 当连接空闲时，是否进行验证
jdbc.testWhileIdle=true

# 连接池检查间隔时间（毫秒）
jdbc.timeBetweenEvictionRunsMillis=60000

# 连接在池中最小生存的时间（毫秒）
jdbc.minEvictableIdleTimeMillis=300000